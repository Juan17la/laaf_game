<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0b0a09;--fog:#8a8580;--bone:#e9e2d3;--rust:#9e140f;--amber:#ffb84d;--brass:#a8875a}
*{box-sizing:border-box;margin:0;padding:0}
body{width:1280px;height:720px;overflow:hidden;background:var(--ink);font-family:"Barlow Semi Condensed",sans-serif;color:var(--bone)}
.scene{position:absolute;inset:0;background:
 radial-gradient(ellipse 60% 45% at 55% 42%,#6f6b66 0%,#3b3835 45%,#151312 85%),#0b0a09}
.scene:after{content:"";position:absolute;left:0;right:0;top:48%;height:52%;background:linear-gradient(#2a2725,#0f0e0d)}
.post{position:absolute;left:62%;top:22%;width:10px;height:260px;background:#1d1b19;opacity:.7}
.figure{position:absolute;left:46%;top:40%;width:26px;height:80px;border-radius:13px 13px 4px 4px;background:#1a1816;opacity:.6}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 40%,rgba(0,0,0,.75));}
.bars:before,.bars:after{content:"";position:absolute;left:0;right:0;height:44px;background:#000}
.bars:before{top:0}.bars:after{bottom:0}
.logo{position:absolute;left:72px;top:84px}
.logo h1{font-family:"IM Fell English",serif;font-weight:400;font-size:112px;letter-spacing:.32em;line-height:1;color:var(--bone)}
.logo .rule{width:300px;height:2px;background:var(--rust);margin:14px 0 10px}
.logo p{font-size:15px;letter-spacing:.6em;color:#a9a39a}
.preview{position:absolute;left:358px;top:298px;width:420px;padding:18px 22px;border-radius:14px;
 background:rgba(14,12,11,.78);border:1px solid rgba(233,226,211,.14);backdrop-filter:blur(6px)}
.preview .k{font-size:13px;letter-spacing:.24em;color:var(--amber);font-weight:700}
.preview h2{font-family:"IM Fell English",serif;font-weight:400;font-size:32px;margin:6px 0 10px}
.chips{display:flex;gap:8px}
.chip{display:flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:rgba(233,226,211,.08);font-size:14px;color:#cfc8ba}
.chip b{color:var(--bone)}
.chip.mark{background:rgba(158,20,15,.28);color:#f0b3a8}
.rail{position:absolute;left:72px;right:72px;top:488px;height:6px;border-radius:3px;background:linear-gradient(#c9a873,#6e5536)}
.fobs{position:absolute;left:96px;right:96px;top:494px;display:flex;justify-content:space-between}
.fob{width:132px;display:flex;flex-direction:column;align-items:center;opacity:.62}
.ring{width:18px;height:22px;border:3px solid var(--brass);border-radius:50%;margin-top:-4px}
.tag{width:96px;height:118px;margin-top:-3px;border-radius:44px 44px 48px 48px;background:linear-gradient(160deg,#2a2622,#151311);
 border:2px solid #3a342d;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.tag svg{width:34px;height:34px;stroke:var(--bone);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tag span{font-weight:700;font-size:14px;letter-spacing:.16em}
.fob.on{opacity:1;transform:translateY(16px) rotate(-3deg)}
.fob.on .tag{background:linear-gradient(160deg,#b0170f,#5e0b07);border-color:#ffb84d;box-shadow:0 18px 30px rgba(0,0,0,.55)}
.fob.on .ring{border-color:var(--amber)}
.fob.dim{opacity:.32}
.help{position:absolute;bottom:58px;left:72px;right:72px;display:flex;justify-content:space-between;font-size:14px;color:#a9a39a;letter-spacing:.05em}
.keys span{display:inline-flex;align-items:center;gap:6px;margin-left:18px}
.keys kbd{font-family:inherit;font-weight:700;font-size:12px;padding:2px 7px;border-radius:5px;border:1px solid #6a645c;color:var(--bone)}
.cap{position:absolute;right:72px;top:96px;text-align:right}
.cap .t{color:#d06a5d;font-size:13px;letter-spacing:.3em;font-weight:700}
.cap .l{font-family:"IM Fell English",serif;font-style:italic;font-size:19px;color:#bdb6a8;margin-top:6px}
</style></head><body>
<div class="scene"><div class="post"></div><div class="figure"></div></div><div class="vig"></div><div class="bars"></div>
<div class="logo"><h1>LAAF</h1><div class="rule"></div><p>HOLLOWMERE</p></div>
<div class="cap"><div class="t">LAST POSTCARD</div><div class="l">"Hollowmere is beautiful. Don't come."</div></div>
<div class="preview">
 <div class="k">CONTINUE · SAMPLE SAVE</div>
 <h2>Chapter I — The Mark</h2>
 <div class="chips"><div class="chip">Motel, Room 6</div><div class="chip"><b>00:42:17</b></div><div class="chip">Normal</div><div class="chip mark">Mark 18%</div></div>
</div>
<div class="rail"></div>
<div class="fobs">
 <div class="fob on"><div class="ring"></div><div class="tag"><svg viewBox="0 0 24 24"><path d="M9 3h6M10 3v2h4V3M7 8h10l-1 11a2 2 0 0 1-2 2h-4a2 2 0 0 1-2-2zM12 11v4"/></svg><span>CONTINUE</span></div></div>
 <div class="fob"><div class="ring"></div><div class="tag"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 8l9 6 9-6"/></svg><span>NEW</span></div></div>
 <div class="fob"><div class="ring"></div><div class="tag"><svg viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11M9 8h6"/></svg><span>LOAD</span></div></div>
 <div class="fob"><div class="ring"></div><div class="tag"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2"/><circle cx="12" cy="11" r="3"/><path d="M8 19l2-4h4l2 4"/></svg><span>EXTRA</span></div></div>
 <div class="fob"><div class="ring"></div><div class="tag"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></svg><span>OPTIONS</span></div></div>
 <div class="fob"><div class="ring"></div><div class="tag"><svg viewBox="0 0 24 24"><path d="M14 3H6v18h8M10 12h10M17 9l3 3-3 3"/></svg><span>QUIT</span></div></div>
</div>
<div class="help"><div>Pick up where the fog left you.</div><div class="keys"><span><kbd>A</kbd><kbd>D</kbd> choose</span><span><kbd>ENTER</kbd> take key</span><span><kbd>ESC</kbd> back</span></div></div>
</body></html>
